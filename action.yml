name: "Vercel Doctor"
description: "Scan Next.js codebases for patterns that increase your Vercel bill; get actionable diagnostics to reduce costs"
branding:
  icon: "activity"
  color: "blue"

inputs:
  directory:
    description: "Project directory to scan"
    default: "."
  verbose:
    description: "Show file details per rule"
    default: "true"
  project:
    description: "Workspace project(s) to scan (comma-separated)"
    required: false
  node-version:
    description: "Node.js version to use (22.17.0 or newer)"
    default: "22"

outputs:
  score:
    description: "Health score (0-100), one line per selected project"
    value: ${{ steps.score.outputs.score }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_PROJECT: ${{ inputs.project }}
      run: |
        FLAGS=()
        if [ "$INPUT_VERBOSE" = "true" ]; then FLAGS+=(--verbose); fi
        if [ -n "$INPUT_PROJECT" ]; then FLAGS+=(--project "$INPUT_PROJECT"); fi
        npx -y vercel-doctor@latest "$INPUT_DIRECTORY" "${FLAGS[@]}"

    - id: score
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_PROJECT: ${{ inputs.project }}
      run: |
        FLAGS=(--score)
        if [ -n "$INPUT_PROJECT" ]; then FLAGS+=(--project "$INPUT_PROJECT"); fi
        SCORE=$(npx -y vercel-doctor@latest "$INPUT_DIRECTORY" "${FLAGS[@]}")
        {
          echo "score<<VERCEL_DOCTOR_SCORE"
          printf '%s\n' "$SCORE"
          echo "VERCEL_DOCTOR_SCORE"
        } >> "$GITHUB_OUTPUT"
